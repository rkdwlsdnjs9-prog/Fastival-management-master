<div class="row">

    <div class="card h-100">
      <div class="card-header d-flex justify-content-between align-items-center border-bottom">
        <h5 class="card-title m-0 fw-semibold">메인 무대 지정석 실시간 좌석 현황</h5>
        <div class="d-flex gap-2">
          <span class="badge bg-success">예매가능</span>
          <span class="badge bg-warning">가선점 (O2O)</span>
          <span class="badge bg-danger">결제완료</span>
        </div>
      </div>
      <div class="card-body py-4">
        <div class="stage-bar bg-dark text-white text-center py-2 mb-6 fw-bold rounded">STAGE (무대 정면)</div>
        <div class="seat-grid d-flex flex-column align-items-center">
          <!-- 10x10 Seat Matrix -->
          <div class="row g-2 mb-2">
            <script>
              const states = ['success', 'danger', 'danger', 'warning', 'success', 'danger', 'danger', 'danger', 'success', 'danger'];
              for(let i=0; i<80; i++) {
                const randState = states[Math.floor(Math.random() * states.length)];
                document.write(`<div class="col-auto"><button class="btn btn-${randState} p-0" style="width: 25px; height: 25px; font-size: 8px;">${i+1}</button></div>`);
                if((i+1) % 10 === 0) document.write('</div><div class="row g-2 mb-2">');
              }
            </script>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  const options = {
    series: [92.4, 78.5, 65.2],
    chart: {
      height: 250,
      type: 'radialBar',
    },
    plotOptions: {
      radialBar: {
        dataLabels: {
          name: { fontSize: '22px' },
          value: { fontSize: '16px' },
          total: {
            show: true,
            label: '총 예매율',
            formatter: function (w) { return '78.7%' }
          }
        }
      }
    },
    labels: ['VIP지정석', '일반지정석', '스탠딩구역'],
    colors: ['#ff3e1d', '#ffab00', '#71dd37']
  };
  const chart = new ApexCharts(document.querySelector("#seatStatsChart"), options);
  chart.render();
</script>
