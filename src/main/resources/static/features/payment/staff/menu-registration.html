<script>
  // Dynamic Category Filtering Logic
  const filterTabs = document.querySelectorAll('#menuFilterTabs button');
  const menuItems = document.querySelectorAll('.menu-list-item');

  filterTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      // Toggle Active Class
      filterTabs.forEach(btn => btn.classList.remove('active'));
      tab.classList.add('active');

      const filterVal = tab.getAttribute('data-filter');

      // Filter Item List
      menuItems.forEach(item => {
        const itemCategory = item.getAttribute('data-category');
        if (filterVal === 'all' || itemCategory === filterVal) {
          item.style.setProperty('display', 'flex', 'important');
        } else {
          item.style.setProperty('display', 'none', 'important');
        }
      });
    });
  });

  // Star Toggle representative menu
  function toggleRepresentative(element, menuName) {
    const starIcon = element.querySelector('.star-icon');
    const parentContainer = element.closest('.menu-list-item');
    const titleHeader = parentContainer.querySelector('h6');

    if (starIcon.classList.contains('bx-star')) {
      // Toggle to Selected (Representative Menu)
      starIcon.classList.remove('bx-star', 'text-muted');
      starIcon.classList.add('bxs-star', 'text-warning');
      
      // Add 'Representative' badge dynamically if it does not exist
      if (!titleHeader.querySelector('.badge')) {
        titleHeader.innerHTML += ' <span class="badge bg-label-warning py-1 px-2 fs-8 ms-1">대표메뉴</span>';
      }
      alert(`★ [${menuName}] 상품이 우리 가게 대표 메뉴로 지정되었습니다!\n소비자 화면 상단에 우선 고정 노출됩니다.`);
    } else {
      // Toggle to Deselected
      starIcon.classList.remove('bxs-star', 'text-warning');
      starIcon.classList.add('bx-star', 'text-muted');

      // Remove Badge
      const badge = titleHeader.querySelector('.badge');
      if (badge) {
        badge.remove();
      }
      alert(`☆ [${menuName}] 대표 메뉴 지정이 해제되었습니다.`);
    }
  }
</script>
