    document.addEventListener('DOMContentLoaded', () => {
      loadMyMenus();
      setupCategoryFilters();

      setupRegisterMenuBtn();
    });

    // ── 배달의민족 스타일 실시간 메뉴 이미지 추천 및 수동 파일 업로드 제어 시스템 ────────────────────
    function setupImageRecommendationSystem() {
      const menuNameInput = document.getElementById('menuNameInput');
      const recommendedSection = document.getElementById('recommended-section');
      const recommendedThumbnails = document.getElementById('recommendedThumbnails');
      const menuImagePreview = document.getElementById('menuImagePreview');
      const manualFileInput = document.getElementById('manualFileInput');
      const menuImageUrlInput = document.getElementById('menuImageUrlInput');
      const clearImageBtn = document.getElementById('clearImageBtn');

      const DEFAULT_IMAGE = 'https://images.unsplash.com/photo-1489641493513-ba4ee84ccea9?auto=format&fit=crop&w=150&h=150&q=80';

      // 1. 실시간 키워드 검색 및 추천 영역 노출
      menuNameInput.addEventListener('input', () => {
        const text = menuNameInput.value.trim();
        if (!text) {
          recommendedSection.style.display = 'none';
          return;
        }

        // 키워드 매칭 수행
        let matchedKey = null;
        for (const key of Object.keys(FESTIVAL_RECOMMENDED_IMAGES)) {
          if (key !== 'DEFAULT' && text.includes(key)) {
            matchedKey = key;
            break;
          }
        }

        // 매칭 키워드가 없으면 DEFAULT 키워드 세트 추천
        const keyToUse = matchedKey || 'DEFAULT';
        const images = FESTIVAL_RECOMMENDED_IMAGES[keyToUse];

        // 썸네일 노출
        recommendedThumbnails.innerHTML = '';
        images.forEach((url, index) => {
          const activeClass = menuImageUrlInput.value === url ? 'border-primary border-3 scale-105 shadow' : 'border-light';
          const thumbnailHtml = `
            <div class="position-relative cursor-pointer flex-shrink-0 thumbnail-card p-1 rounded border ${activeClass}" 
                 style="width: 76px; height: 76px; transition: all 0.2s;"
                 onclick="selectRecommendedImage('${url}', this)">
              <img src="${url}" class="w-100 h-100 rounded object-fit-cover" />
            </div>
          `;
          recommendedThumbnails.insertAdjacentHTML('beforeend', thumbnailHtml);
        });

        recommendedSection.style.display = 'block';
      });

      // 추천 이미지 전역 선택 함수
      window.selectRecommendedImage = function (url, cardElement) {
        // 수동 파일 인풋 초기화
        manualFileInput.value = '';

        // 데이터 바인딩 및 미리보기
        menuImageUrlInput.value = url;
        menuImagePreview.src = url;
        clearImageBtn.style.display = 'block';

        // 썸네일 하이라이팅 효과 갱신
        document.querySelectorAll('.thumbnail-card').forEach(card => {
          card.classList.remove('border-primary', 'border-3', 'scale-105', 'shadow');
          card.classList.add('border-light');
        });
        if (cardElement) {
          cardElement.classList.remove('border-light');
          cardElement.classList.add('border-primary', 'border-3', 'scale-105', 'shadow');
        }
      };

      // 2. 수동 이미지 파일 업로드 시 우선순위 제재 로직
      manualFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // 용량 제한 체크 (5MB)
        if (file.size > 5 * 1024 * 1024) {
          alert('⚠️ 이미지 용량은 최대 5MB를 넘을 수 없습니다!');
          manualFileInput.value = '';
          return;
        }

        const reader = new FileReader();
        reader.onload = function (evt) {
          const base64Url = evt.target.result;

          // 데이터 바인딩 및 미리보기
          menuImageUrlInput.value = base64Url;
          menuImagePreview.src = base64Url;
          clearImageBtn.style.display = 'block';

          // 추천 썸네일 하이라이팅 해제
          document.querySelectorAll('.thumbnail-card').forEach(card => {
            card.classList.remove('border-primary', 'border-3', 'scale-105', 'shadow');
            card.classList.add('border-light');
          });
        };
        reader.readAsDataURL(file);
      });

      // 3. 이미지 해제/초기화 기능
      clearImageBtn.addEventListener('click', () => {
        manualFileInput.value = '';
        menuImageUrlInput.value = '';
        menuImagePreview.src = DEFAULT_IMAGE;
        clearImageBtn.style.display = 'none';

        // 추천 썸네일 하이라이팅 해제
        document.querySelectorAll('.thumbnail-card').forEach(card => {
          card.classList.remove('border-primary', 'border-3', 'scale-105', 'shadow');
          card.classList.add('border-light');
        });
      });
    }

    // ── [옵션 그룹 추가] 버튼 ────────────────────────────────────────
    function setupOptionGroupBtn() {
      document.getElementById('addOptionGroupBtn').addEventListener('click', () => {
        optionGroupCount++;
        const container = document.getElementById('optionGroupsContainer');
        const groupId = `optGroup_${optionGroupCount}`;

        const groupHtml = `
        <div class="border border-2 rounded-3 p-4 mb-3 bg-light" id="${groupId}">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex align-items-center gap-2 flex-grow-1 me-3">
              <strong class="text-dark fs-6 text-nowrap">그룹 ${optionGroupCount}:</strong>
              <input type="text" class="form-control form-control-sm option-group-name"
                     placeholder="그룹명 (예: 매운맛 선택)" style="font-size:0.9rem;" />
            </div>
            <button type="button" class="btn btn-sm btn-link text-danger p-0 fw-bold"
                    onclick="removeOptionGroup('${groupId}')">
              <i class="bx bx-trash me-1"></i>삭제
            </button>
          </div>
          <div class="option-items-wrapper">
            <div class="row g-2 mb-2 option-item-row">
              <div class="col-6"><input type="text" class="form-control form-control-lg py-2 option-item-name" placeholder="옵션명" style="font-size:0.9rem;" /></div>
              <div class="col-4"><input type="number" class="form-control form-control-lg py-2 option-item-price" placeholder="추가금액" value="0" style="font-size:0.9rem;" /></div>
              <div class="col-2 d-flex align-items-center">
                <button type="button" class="btn btn-sm btn-outline-secondary w-100"
                        onclick="removeOptionItem(this)"><i class="bx bx-minus"></i></button>
              </div>
            </div>
          </div>
          <button type="button" class="btn btn-sm btn-outline-info mt-2"
                  onclick="addOptionItem(this)">
            <i class="bx bx-plus me-1"></i>옵션 항목 추가
          </button>
        </div>
      `;
        container.insertAdjacentHTML('beforeend', groupHtml);
      });
    }

    // 옵션 그룹 내 옵션 항목 추가
    function addOptionItem(btn) {
      const wrapper = btn.closest('.border').querySelector('.option-items-wrapper');
      const rowHtml = `
      <div class="row g-2 mb-2 option-item-row">
        <div class="col-6"><input type="text" class="form-control form-control-lg py-2 option-item-name" placeholder="옵션명" style="font-size:0.9rem;" /></div>
        <div class="col-4"><input type="number" class="form-control form-control-lg py-2 option-item-price" placeholder="추가금액" value="0" style="font-size:0.9rem;" /></div>
        <div class="col-2 d-flex align-items-center">
          <button type="button" class="btn btn-sm btn-outline-secondary w-100"
                  onclick="removeOptionItem(this)"><i class="bx bx-minus"></i></button>
        </div>
      </div>
    `;
      wrapper.insertAdjacentHTML('beforeend', rowHtml);
    }

    // 옵션 항목 삭제
    function removeOptionItem(btn) {
      const row = btn.closest('.option-item-row');
      if (row) row.remove();
    }

    // 옵션 그룹 전체 삭제
    function removeOptionGroup(groupId) {
      const group = document.getElementById(groupId);
      if (group) group.remove();
    }

    // ── 옵션 그룹 데이터 수집 ──────────────────────────────────────
    function collectOptionGroups() {
      const groups = [];
      document.querySelectorAll('#optionGroupsContainer .border').forEach(group => {
        const groupName = group.querySelector('.option-group-name')?.value.trim() || '옵션';
        const items = [];
        group.querySelectorAll('.option-item-row').forEach(row => {
          const name = row.querySelector('.option-item-name')?.value.trim();
          const price = parseInt(row.querySelector('.option-item-price')?.value || '0', 10);
          if (name) items.push({ name, price });
        });
        if (items.length > 0) groups.push({ groupName, items });
      });
      return groups;
    }

    // ── [신규 메뉴 최종 마스터 등록] 버튼 ──────────────────────────
    function setupRegisterMenuBtn() {
      document.getElementById('registerMenuBtn').addEventListener('click', () => {
        const nameInput = document.getElementById('menuNameInput');
        const priceInput = document.getElementById('menuPriceInput');
        const categorySelect = document.getElementById('menuCategorySelect');

        const name = nameInput.value.trim();
        const price = parseInt(priceInput.value || '0', 10);
        const productType = categorySelect.value;
        const optionGroups = collectOptionGroups();

        // ── 유효성 검사 ─────────────────────────────────────────
        if (!name) {
          nameInput.focus();
          nameInput.classList.add('is-invalid');
          alert('⚠️ 상품명을 입력해 주세요!');
          return;
        }
        if (isNaN(price) || price < 0) {
          priceInput.focus();
          alert('⚠️ 유효한 판매 가격을 입력해 주세요!');
          return;
        }
        nameInput.classList.remove('is-invalid');

        // ── 등록 버튼 로딩 상태 ─────────────────────────────────
        const btn = document.getElementById('registerMenuBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>등록 중...';

        // ── API 호출 (POST) ─────────────────────────────────────
        const imageUrl = document.getElementById('menuImageUrlInput').value;

        fetch('/api/payment/staff/menus', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': getAuthHeader()
          },
          body: JSON.stringify({ name, price, productType, optionGroups, imageUrl })
        })
          .then(res => {
            if (!res.ok) return res.json().then(err => { throw new Error(err.message || '등록 실패'); });
            return res.json();
          })
          .then(data => {
            // ── 등록 성공 처리 ──────────────────────────────────
            const optionSummary = optionGroups.length > 0
              ? `\n옵션 그룹 ${optionGroups.length}개 (총 ${optionGroups.reduce((a, g) => a + g.items.length, 0)}개 옵션)`
              : '\n(옵션 없음)';

            alert(`✅ ${data.message}\n\n` +
              `📦 상품명: ${data.name}\n` +
              `💰 가격: ₩${(data.price || 0).toLocaleString()}\n` +
              `🏷️ 카테고리: ${data.productType}${optionSummary}`);

            // 폼 초기화
            nameInput.value = '';
            priceInput.value = '';
            document.getElementById('optionGroupsContainer').innerHTML = '';
            optionGroupCount = 0;

            // 이미지 입력 초기화 트리거
            document.getElementById('clearImageBtn').click();
            // 추천 영역 닫기
            document.getElementById('recommended-section').style.display = 'none';

            // 메뉴 목록 갱신
            loadMyMenus();
          })
          .catch(err => {
            console.error('메뉴 등록 오류:', err);
            alert('❌ 메뉴 등록 중 오류가 발생했습니다.\n' + err.message);
          })
          .finally(() => {
            btn.disabled = false;
            btn.innerHTML = '<i class="bx bx-check-circle me-2 fs-5"></i>신규 메뉴 최종 마스터 등록';
          });
      });
    }

    // ── 메뉴 목록 조회 ──────────────────────────────────────────────
    function loadMyMenus() {
      const container = document.getElementById('menuItemContainer');
      container.innerHTML = `
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted fs-7">실시간 매장 메뉴를 불러오는 중...</p>
      </div>
    `;

      fetch('/api/payment/staff/menus', {
        headers: { 'Authorization': getAuthHeader() }
      })
        .then(res => {
          if (!res.ok) throw new Error('메뉴 로드 실패');
          return res.json();
        })
        .then(menus => {
          allMenusCache = menus;
          renderMenus('all');
        })
        .catch(err => {
          console.error(err);
          container.innerHTML = `
        <div class="text-center py-5 text-danger">
          <i class="bx bx-error-circle fs-1"></i>
          <p class="mt-2 fw-bold">메뉴 목록 로드 중 오류가 발생했습니다.</p>
        </div>
      `;
        });
    }

    // ── 메뉴 목록 렌더링 ────────────────────────────────────────────
    function renderMenus(filterVal) {
      const container = document.getElementById('menuItemContainer');
      container.innerHTML = '';

      const filtered = allMenusCache.filter(item => {
        if (filterVal === 'all') return true;
        const type = (item.productType || item.product_type || '').toUpperCase();
        return type === filterVal.toUpperCase();
      });

      if (filtered.length === 0) {
        container.innerHTML = `
        <div class="text-center py-5 text-muted">
          <i class="bx bx-info-circle fs-2"></i>
          <p class="mt-2 fs-7">등록된 메뉴가 없습니다.<br>왼쪽 폼에서 신규 메뉴를 등록해 보세요!</p>
        </div>
      `;
        return;
      }

      filtered.forEach(item => {
        const isRep = item.isRepresentative === true || item.is_representative === true;
        const repStarClass = isRep ? 'bxs-star text-warning' : 'bx-star text-muted';
        const repBadgeHtml = isRep ? ' <span class="badge bg-label-warning py-1 px-2 fs-8 ms-1">대표메뉴</span>' : '';
        const formattedPrice = (item.price || 0).toLocaleString();
        const imageUrl = item.imageUrl || item.image_url || 'https://images.unsplash.com/photo-1585647347483-22b66260dfff?q=80&w=150&auto=format&fit=crop';
        const prodName = item.productName || item.name || '메뉴명';
        const categoryLabel = (item.productType || item.product_type || 'FOOD').toUpperCase();

        container.insertAdjacentHTML('beforeend', `
        <div class="list-group-item d-flex justify-content-between align-items-center py-4 px-3 hover-bg-light transition-all menu-list-item">
          <div class="d-flex align-items-center">
            <div class="me-3 cursor-pointer" onclick="toggleRepresentative(${item.id}, '${prodName.replace("'", "\\'")}', this)">
              <i class="bx ${repStarClass} fs-3 star-icon" style="cursor: pointer;"></i>
            </div>
            <div class="avatar avatar-md me-3" style="width: 52px; height: 52px;">
              <img src="${imageUrl}" class="rounded-3 w-100 h-100 object-fit-cover"
                   onerror="this.src='https://images.unsplash.com/photo-1585647347483-22b66260dfff?q=80&w=150&auto=format&fit=crop';" />
            </div>
            <div>
              <h6 class="mb-1 fw-bold text-dark fs-6">${prodName}${repBadgeHtml}</h6>
              <small class="text-muted">₩ ${formattedPrice} / 구분: ${categoryLabel}</small>
            </div>
          </div>
          <button class="btn btn-md btn-outline-secondary py-2 px-3 fw-bold" style="min-width: 64px;">관리</button>
        </div>
      `);
      });
    }

    // ── 카테고리 필터 탭 ────────────────────────────────────────────
    function setupCategoryFilters() {
      const filterTabs = document.querySelectorAll('#menuFilterTabs button');
      filterTabs.forEach(tab => {
        tab.addEventListener('click', () => {
          filterTabs.forEach(btn => btn.classList.remove('active'));
          tab.classList.add('active');
          renderMenus(tab.getAttribute('data-filter'));
        });
      });
    }

    // ── 대표 메뉴 토글 ──────────────────────────────────────────────
    function toggleRepresentative(menuId, menuName, element) {
      fetch(`/api/payment/staff/menus/${menuId}/representative`, {
        method: 'PUT',
        headers: { 'Authorization': getAuthHeader() }
      })
        .then(res => { if (!res.ok) throw new Error('대표 설정 실패'); return res.json(); })
        .then(data => {
          const isRep = data.isRepresentative;
          const starIcon = element.querySelector('.star-icon');
          const parentContainer = element.closest('.menu-list-item');
          const titleHeader = parentContainer.querySelector('h6');

          if (isRep) {
            starIcon.className = 'bx bxs-star text-warning fs-3 star-icon';
            if (!titleHeader.querySelector('.badge')) {
              titleHeader.innerHTML += ' <span class="badge bg-label-warning py-1 px-2 fs-8 ms-1">대표메뉴</span>';
            }
            alert(`★ [${menuName}] 상품이 대표 메뉴로 지정되었습니다!`);
          } else {
            starIcon.className = 'bx bx-star text-muted fs-3 star-icon';
            const badge = titleHeader.querySelector('.badge');
            if (badge) badge.remove();
            alert(`☆ [${menuName}] 대표 메뉴 지정이 해제되었습니다.`);
          }
          const cached = allMenusCache.find(x => x.id === menuId);
          if (cached) { cached.isRepresentative = isRep; cached.is_representative = isRep; }
        })
        .catch(err => { console.error(err); alert('❌ 대표 메뉴 갱신 중 에러가 발생했습니다.'); });
    }
  </script>
</body>
