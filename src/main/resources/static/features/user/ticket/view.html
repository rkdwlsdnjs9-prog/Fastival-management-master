<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 티켓 | FESTIO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #0d1117; color: white; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .ticket-container { background: #161b22; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; max-width: 320px; width: 100%; box-sizing: border-box; }
        .title { color: #10b981; font-weight: 900; font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #a0aec0; font-size: 14px; margin-bottom: 30px; }
        .qr-box { background: white; padding: 15px; border-radius: 12px; display: inline-block; margin-bottom: 20px; }
        .timer-container { background: #30363d; border-radius: 10px; height: 10px; width: 100%; overflow: hidden; margin-top: 10px; }
        .timer-bar { background: linear-gradient(90deg, #10b981, #38bdf8); height: 100%; width: 100%; transition: width 1s linear; }
        .timer-text { font-size: 12px; color: #8b949e; margin-top: 5px; }
        .warning { font-size: 11px; color: #ef4444; margin-top: 20px; }
        #qr-code { width: 200px; height: 200px; margin: 0 auto; }
        .totp-code { font-family: monospace; font-size: 24px; letter-spacing: 5px; color: #38bdf8; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="ticket-container">
        <div class="title">FESTIO TICKET</div>
        <div class="subtitle">입장 시 스태프에게 보여주세요</div>
        
        <div class="totp-code" id="totp-display">------</div>
        
        <div class="qr-box" id="qr-box">
            <div id="qr-code"></div>
        </div>
        
        <div class="timer-container">
            <div class="timer-bar" id="timer-bar"></div>
        </div>
        <div class="timer-text"><span id="timer-sec">30</span>초 후 코드가 새로고침됩니다.</div>
        
        <div class="warning">
            ※ 캡처된 화면은 사용할 수 없습니다.<br>
            ※ 스크린샷 방지 보안이 적용된 티켓입니다.
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        const hexSecret = urlParams.get('secret');

        let qrCodeInstance = null;

        async function generateTotp(hexSecret) {
            const keyBytes = new Uint8Array(hexSecret.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
            const cryptoKey = await crypto.subtle.importKey(
                "raw", keyBytes, { name: "HMAC", hash: "SHA-1" }, false, ["sign"]
            );
            
            const epoch = Math.floor(Date.now() / 30000);
            const counterBytes = new Uint8Array(8);
            let temp = epoch;
            for (let i = 7; i >= 0; i--) {
                counterBytes[i] = temp & 0xFF;
                temp = Math.floor(temp / 256);
            }
            
            const signature = await crypto.subtle.sign("HMAC", cryptoKey, counterBytes);
            const hash = new Uint8Array(signature);
            
            const offset = hash[hash.length - 1] & 0x0F;
            const binary = ((hash[offset] & 0x7F) << 24) |
                           ((hash[offset + 1] & 0xFF) << 16) |
                           ((hash[offset + 2] & 0xFF) << 8) |
                           (hash[offset + 3] & 0xFF);
                           
            const otp = binary % 1000000;
            return otp.toString().padStart(6, '0');
        }

        async function refreshTotp() {
            if (!orderId || !hexSecret) {
                document.getElementById('totp-display').innerText = "ERROR";
                return;
            }
            try {
                const code = await generateTotp(hexSecret);
                document.getElementById('totp-display').innerText = code;
                
                const payload = `TOTP:${orderId}:${code}`;
                
                const qrContainer = document.getElementById('qr-code');
                qrContainer.innerHTML = ''; // clear old
                qrCodeInstance = new QRCode(qrContainer, {
                    text: payload,
                    width: 200,
                    height: 200,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            } catch (e) {
                console.error(e);
            }
        }

        function updateTimer() {
            const currentSeconds = Math.floor(Date.now() / 1000) % 30;
            const remaining = 30 - currentSeconds;
            
            document.getElementById('timer-sec').innerText = remaining;
            const percentage = (remaining / 30) * 100;
            document.getElementById('timer-bar').style.width = percentage + '%';
            
            if (remaining === 30 || remaining === 29 && currentSeconds === 1) { // Redraw when window resets
                refreshTotp();
            }
        }

        // Init
        refreshTotp();
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
