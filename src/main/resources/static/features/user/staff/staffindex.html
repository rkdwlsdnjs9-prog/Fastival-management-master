        <li class="menu-item">
          <a href="scanner.html" class="menu-link" data-page="scanner">

        </li>

        <li class="menu-item" style="border-top: 1px dashed #30363d; margin: 15px 10px 5px 10px;"></li>

        <li class="menu-item">

            <span class="menu-icon">☕</span>

        </li>
        <li class="menu-item">
          <a href="goods.html" class="menu-link" data-page="goods">

        </li>

        <div class="header-actions">

            <div id="notif-popover" class="notif-popover-rigid">

                <span style="color:#10b981; font-family:var(--font-mono);">SYNC OK</span>

              <div class="notif-list-container" id="notif-list"></div>

          <button id="logout-btn">로그아웃</button>
        </div>
      </header>

      <div id="main-content">
        <!-- Login screen (shown when not authenticated) -->
        <section id="view-login" class="content-view active">
          <!-- Rendered by js/ui.js -->
        </section>

        <!-- Dashboard view -->
        <section id="view-dashboard" class="content-view">
          <!-- Rendered by js/ui.js -->
        </section>

  <script type="module">
    import { initUI } from '/assets/js/staff/ui.js';
