<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>(임시) QR 목록 | FESTIO</title>
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body>
  <div id="app-shell">
    <aside id="sidebar" class="collapsed">
      <div class="sidebar-header">
        <span class="sidebar-title" style="background: linear-gradient(90deg, #38bdf8, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; letter-spacing: 1px;">FESTIO STAFF SYSTEM</span>
      </div>
      <ul class="sidebar-menu">
        <!-- Loaded dynamically from /features/user/staff/menu_aside.html -->
      </ul>
    </aside>

    <main id="main-container">
      <header id="header">
        <button id="toggle-sidebar-btn" class="header-menu-btn">≡</button>
        <div id="header-checkpoint">임시 메뉴</div>
        <div class="header-actions">
          <span id="header-user">인증 대기 중</span>
          <button id="logout-btn">로그아웃</button>
        </div>
      </header>

      <div id="main-content">
        <section class="content-view active">
          <div class="panel-rigid">
            <div class="panel-header-rigid">(임시) 서버 메모리 QR 티켓 목록 조회</div>
            <div class="panel-body-rigid">
              <p>현재 서버 메모리에 생성된 발급 완료 QR 코드 및 티켓 번호를 조회하는 임시 화면입니다.</p>
              <button id="btn-load-qr" class="btn btn-rigid btn-small btn-blue">새로고침</button>
              <div id="qr-list-container" style="margin-top: 20px;">
                <!-- QR lists will be displayed here dynamically -->
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module">
    import { initPage } from '/assets/js/ui.js';
    document.addEventListener("DOMContentLoaded", () => { 
        initPage('qr-list'); 
        
        const loadQRCodes = async () => {
            const container = document.getElementById('qr-list-container');
            container.innerHTML = "<em style='color:#a0aec0;'>데이터를 불러오는 중...</em>";
            try {
                const res = await fetch('/api/order/tickets/qr');
                const data = await res.json();
                
                if (!data || data.length === 0) {
                    container.innerHTML = "<div style='color:#ef4444; padding:20px; border:1px solid #ef4444; border-radius:8px;'>현재 메모리에 발급된 티켓(QR)이 없습니다.<br>현장 예매를 진행하면 여기에 티켓이 나타납니다. (서버 재시작 시 초기화됨)</div>";
                    return;
                }
                
                let html = '<div style="display: flex; gap: 20px; flex-wrap: wrap;">';
                data.forEach(item => {
                    // Use a free public API to generate a QR image from the text payload instantly
                    const qrImgUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(item.qrPayload)}`;
                    
                    html += `
                        <div style="border: 2px solid #30363d; border-radius: 12px; padding: 20px; width: 280px; text-align: center; background-color: #161b22; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
                            <h3 style="margin-top: 0; color: #10b981; font-weight: 900;">🎟️ ORD-${item.orderId}</h3>
                            <div style="font-family: var(--font-mono); color: #38bdf8; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; background: rgba(56, 189, 248, 0.1); padding: 5px; border-radius: 4px;">
                                ${item.ticketNumber}
                            </div>
                            <p style="color: #a0aec0; margin-bottom: 15px;">좌석: <strong style="color:white;">${item.seats}</strong></p>
                            
                            <div style="background: white; padding: 10px; border-radius: 8px; display: inline-block;">
                                <img src="${qrImgUrl}" alt="QR Code" style="width: 150px; height: 150px;">
                            </div>
                            
                            <p style="margin-top: 15px; font-size: 0.8rem; color: #8b949e; word-break: break-all;">
                                Payload:<br>${item.qrPayload}
                            </p>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
                
            } catch(e) {
                console.error(e);
                container.innerHTML = "<span style='color:red;'>데이터 로딩 실패</span>";
            }
        };

        const btn = document.getElementById('btn-load-qr');
        btn.addEventListener('click', loadQRCodes);
        
        // 초기 로드
        loadQRCodes();
    });
  </script>
</body>
</html>
