          <a class="cat-dropdown-item" data-cat="classic" data-sub="gukak"><span>국악</span></a>

      </button>
      <button class="header-cat-item" data-cat="exhibition">전시/스포츠
        <svg class="icon cat-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
        <div class="cat-dropdown">
          <a class="cat-dropdown-item" data-cat="exhibition" data-sub="all"><span>전체보기</span></a>
          <a class="cat-dropdown-item" data-cat="exhibition" data-sub="exhibition"><span>전시</span></a>
          <a class="cat-dropdown-item" data-cat="exhibition" data-sub="experience"><span>체험/행사</span></a>

    <!-- 액션 버튼 -->

  <!-- 메인 회원가입 컨텐츠 영역 -->
  <main class="page-body register-page-body">
    <div class="register-container">
      <div class="back-btn-wrap">
        <a href="login.html" class="back-link">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          로그인 화면으로 돌아가기
        </a>
      </div>

      <div class="register-card">
        <div class="register-header">
          <div class="register-logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="url(#gradient-icon)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <defs>
                <linearGradient id="gradient-icon" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#667eea" />
                  <stop offset="100%" style="stop-color:#764ba2" />
                </linearGradient>
              </defs>
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </div>
          <h1 class="register-logo">FESTIO</h1>
          <p class="register-subtitle">통합 브랜드 신규 회원가입</p>
        </div>

        <form id="registerForm" novalidate>
          <!-- 이메일 주소 -->
          <div class="form-group">
            <label class="form-label" for="registerEmail">이메일 주소 (아이디)</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                <polyline points="22,6 12,13 2,6" />
              </svg>
              <input type="email" id="registerEmail" class="form-input" placeholder="example@festio.com" required>
            </div>
          </div>

          <!-- 이메일 인증 -->
          <div class="form-group">
            <label class="form-label" for="emailAuthCode">이메일 인증번호</label>
            <div class="auth-input-wrapper">
              <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                  <polyline points="22 4 12 14.01 9 11.01" />
                </svg>
                <input type="text" id="emailAuthCode" class="form-input" placeholder="인증번호 6자리 입력" maxlength="6">
              </div>
              <button type="button" class="btn-auth" id="btnSendAuthCode">인증번호 발송</button>
            </div>
            <div class="auth-status" id="authStatus"></div>
          </div>

          <!-- 본명 -->
          <div class="form-group">
            <label class="form-label" for="registerName">이름 (실명)</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              <input type="text" id="registerName" class="form-input" placeholder="홍길동" required>
            </div>
          </div>

          <!-- 휴대폰 번호 -->
          <div class="form-group">
            <label class="form-label" for="registerPhone">휴대폰 번호</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z" />
              </svg>
              <input type="tel" id="registerPhone" class="form-input" placeholder="010-1234-5678" required>
            </div>
          </div>

          <!-- 비밀번호 -->
          <div class="form-group">
            <label class="form-label" for="registerPassword">비밀번호</label>
            <div class="input-wrapper password-group">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0110 0v4" />
              </svg>
              <input type="password" id="registerPassword" class="form-input" placeholder="••••••••" required>
              <button type="button" class="btn-toggle-pw" id="togglePassword" aria-label="비밀번호 표시">
                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <!-- 비밀번호 확인 -->
          <div class="form-group">
            <label class="form-label" for="registerConfirmPassword">비밀번호 확인</label>
            <div class="input-wrapper password-group">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0110 0v4" />
              </svg>
              <input type="password" id="registerConfirmPassword" class="form-input" placeholder="••••••••" required>
              <button type="button" class="btn-toggle-pw" id="toggleConfirmPassword" aria-label="비밀번호 표시">
                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <!-- 약관 동의 -->
          <div class="terms-section">
            <div class="terms-checkbox-wrapper">
              <label class="custom-checkbox">
                <input type="checkbox" id="agreeAll" required>
                <span class="checkmark">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </span>
                <span class="checkbox-text">전체 동의</span>
              </label>
            </div>
            <div class="terms-divider"></div>
            <div class="terms-checkbox-wrapper">
              <label class="custom-checkbox">
                <input type="checkbox" id="agreeTerms" required>
                <span class="checkmark">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </span>
                <span class="checkbox-text">이용약관 동의 <span class="required">(필수)</span></span>
              </label>
              <a href="terms.html" class="terms-link" target="_blank">보기</a>
            </div>
            <div class="terms-checkbox-wrapper">
              <label class="custom-checkbox">
                <input type="checkbox" id="agreePrivacy" required>
                <span class="checkmark">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </span>
                <span class="checkbox-text">개인정보처리방침 동의 <span class="required">(필수)</span></span>
              </label>
              <a href="privacy.html" class="terms-link" target="_blank">보기</a>
            </div>
            <div class="terms-checkbox-wrapper">
              <label class="custom-checkbox">
                <input type="checkbox" id="agreeMarketing">
                <span class="checkmark">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </span>
                <span class="checkbox-text">마케팅 정보 수신 동의 <span class="optional">(선택)</span></span>
              </label>
            </div>
          </div>

          <button type="submit" class="btn-register">회원가입 완료</button>
        </form>

        <div class="register-footer">
          이미 계정이 있으신가요? <a href="login.html">로그인하기</a>
        </div>
      </div>
    </div>
  </main>

  <!-- ══ 하단 네비 (모바일) ════════════════════════════════════ -->

          d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" />

  <!-- Toast 알림 라이브러리 및 공통 JS 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/register.js"></script>
  <script>
    // 비밀번호 토글 기능
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('registerPassword');
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      
      const eyeIcon = this.querySelector('.eye-icon');
      if (type === 'text') {
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" /><line x1="1" y1="1" x2="23" y2="23" />';
      } else {
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" />';
      }
    });

    document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('registerConfirmPassword');
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      
      const eyeIcon = this.querySelector('.eye-icon');
      if (type === 'text') {
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" /><line x1="1" y1="1" x2="23" y2="23" />';
      } else {
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" />';
      }
    });

    // 전체 동의 체크박스
    document.getElementById('agreeAll').addEventListener('change', function() {
      const isChecked = this.checked;
      document.getElementById('agreeTerms').checked = isChecked;
      document.getElementById('agreePrivacy').checked = isChecked;
      document.getElementById('agreeMarketing').checked = isChecked;
    });

    // 개별 체크박스 변경 시 전체 동의 업데이트
    const individualCheckboxes = ['agreeTerms', 'agreePrivacy', 'agreeMarketing'];
    individualCheckboxes.forEach(id => {
      document.getElementById(id).addEventListener('change', function() {
        const allChecked = individualCheckboxes.every(id => document.getElementById(id).checked);
        document.getElementById('agreeAll').checked = allChecked;
      });
    });

    // 이메일 인증번호 발송
    let authCode = '';
    document.getElementById('btnSendAuthCode').addEventListener('click', async function() {
      const email = document.getElementById('registerEmail').value;
      if (!email || !email.includes('@')) {
        alert('올바른 이메일 주소를 입력해주세요.');
        return;
      }

      this.disabled = true;
      this.textContent = '발송 중...';

      try {
        // 6자리 인증번호 생성
        authCode = Math.floor(100000 + Math.random() * 900000).toString();
        
        // 여기에 SMTP 이메일 발송 로직 추가 필요
        console.log('인증번호:', authCode);
        console.log('이메일:', email);
        
        // 데모용으로 인증번호 표시 (실제로는 이메일로 발송)
        document.getElementById('authStatus').innerHTML = '<span class="auth-success">인증번호가 발송되었습니다. (데모용: ' + authCode + ')</span>';
        
        this.textContent = '재발송';
        this.disabled = false;
      } catch (error) {
        console.error('인증번호 발송 실패:', error);
        document.getElementById('authStatus').innerHTML = '<span class="auth-error">인증번호 발송에 실패했습니다.</span>';
        this.textContent = '인증번호 발송';
        this.disabled = false;
      }
    });

    // 회원가입 폼 제출
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('registerEmail').value;
      const name = document.getElementById('registerName').value;
      const phone = document.getElementById('registerPhone').value;
      const password = document.getElementById('registerPassword').value;
      const confirmPassword = document.getElementById('registerConfirmPassword').value;
      const inputAuthCode = document.getElementById('emailAuthCode').value;
      const agreeTerms = document.getElementById('agreeTerms').checked;
      const agreePrivacy = document.getElementById('agreePrivacy').checked;

      // 이메일 인증 확인
      if (inputAuthCode !== authCode) {
        alert('이메일 인증번호가 올바르지 않습니다.');
        return;
      }

      // 비밀번호 확인
      if (password !== confirmPassword) {
        alert('비밀번호가 일치하지 않습니다.');
        return;
      }

      // 약관 동의 확인
      if (!agreeTerms || !agreePrivacy) {
        alert('필수 약관에 동의해주세요.');
        return;
      }

      try {
        // 여기에 회원가입 로직 추가
        console.log('회원가입 정보:', { email, name, phone, password });
        alert('회원가입이 완료되었습니다.');
        window.location.href = 'login.html';
      } catch (error) {
        console.error('회원가입 실패:', error);
        alert('회원가입에 실패했습니다.');
      }
    });
  </script>
</body>

</html>
