<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FESTIO | 모든 행사</title>

  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/list.css">
</head>

<body>
  <script src="js/components/sidePanel.js"></script>

  <!-- ══ 헤더 ═══════════════════════════════════════════════════ -->
  <header class="app-header" role="banner" id="appHeader">
    <!-- 햄버거 -->
    <button class="header-hamburger" id="hamburgerBtn" aria-label="전체 메뉴 열기" aria-expanded="false">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>

    <!-- 로고 -->
    <a href="index.html" class="header-logo" aria-label="FESTIO 홈">
      <span class="header-logo-text">FESTIO</span>
    </a>

    <!-- 데스크톱 카테고리 네비 -->
    <nav class="header-cat-nav" aria-label="주요 카테고리">
      <button class="header-cat-item" data-cat="concert">콘서트
        <svg class="icon cat-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
        <div class="cat-dropdown">
          <a class="cat-dropdown-item" data-cat="concert" data-sub="all"><span>전체보기</span></a>
          <a class="cat-dropdown-item" data-cat="concert" data-sub="domestic"><span>국내뮤지션</span></a>
          <a class="cat-dropdown-item" data-cat="concert" data-sub="overseas"><span>해외뮤지션</span></a>
          <a class="cat-dropdown-item" data-cat="concert" data-sub="festival"><span>페스티벌</span></a>
        </div>
      </button>
      <button class="header-cat-item" data-cat="musical">뮤지컬</button>
      <button class="header-cat-item" data-cat="play">연극</button>
      <button class="header-cat-item" data-cat="classic">클래식/무용<svg class="icon cat-arrow" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
        <div class="cat-dropdown">
          <a class="cat-dropdown-item" data-cat="classic" data-sub="all"><span>전체보기</span></a>
          <a class="cat-dropdown-item" data-cat="classic" data-sub="classic"><span>클래식</span></a>
          <a class="cat-dropdown-item" data-cat="classic" data-sub="ballet"><span>발레/무용</span></a>
          <a class="cat-dropdown-item" data-cat="classic" data-sub="gukak"><span>국악</span></a>
        </div>
      </button>
      <button class="header-cat-item" data-cat="exhibition">전시/스포츠<svg class="icon cat-arrow" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
        <div class="cat-dropdown">
          <a class="cat-dropdown-item" data-cat="exhibition" data-sub="all"><span>전체보기</span></a>
          <a class="cat-dropdown-item" data-cat="exhibition" data-sub="exhibition"><span>전시</span></a>
          <a class="cat-dropdown-item" data-cat="exhibition" data-sub="experience"><span>체험/행사</span></a>
          <a class="cat-dropdown-item" data-cat="exhibition" data-sub="sports"><span>스포츠</span></a>
        </div>
      </button>
      <button class="header-cat-item" data-cat="family">가족/어린이</button>
      <button class="header-cat-item" data-cat="local">지역축제</button>
      <button class="header-cat-item" data-cat="univ">대학축제</button>
      <button class="header-cat-item" data-cat="expo">박람회</button>
    </nav>

    <div class="header-spacer"></div>

    <!-- 액션 버튼 -->
    <div class="header-actions">
      <a href="mypage.html" class="header-text-btn" aria-label="MY티켓">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M20 12v6a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h6" />
          <path d="M14 4h6v6" />
          <path d="M10 14L20 4" />
        </svg>
        MY티켓
      </a>
      <!-- 데스크톱 검색 -->
      <div class="header-search-bar" role="search">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="search" class="header-search-input" id="headerSearch" placeholder="행사명, 아티스트 검색" autocomplete="off"
          aria-label="검색">
      </div>
      <!-- 모바일 검색 -->
      <button class="header-icon-btn mobile-search-btn" aria-label="검색">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      </button>
      <!-- 알림 -->
      <button class="header-icon-btn" aria-label="알림">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 01-3.46 0" />
        </svg>
      </button>
      <!-- 마이페이지 -->
      <a href="mypage.html" class="header-icon-btn" aria-label="마이페이지">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </a>
    </div>
  </header>

  <!-- 모바일 검색 모달 -->
  <div class="modal-overlay modal-center" id="modal-mobile-search" role="dialog" aria-modal="true">
    <div class="modal-sheet">
      <div class="modal-header search-modal-header">
        <button class="modal-close-btn" data-close-modal="modal-mobile-search" aria-label="닫기">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="mobile-search-form">
          <div class="mobile-search-input-wrap">
            <svg class="icon search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="search" class="filter-range-input mobile-search-input" id="mobileSearchInput"
              placeholder="행사명, 아티스트 검색" autocomplete="off">
          </div>
          <button class="btn btn-pastel-blue" id="btn-mobile-search-execute">검색</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 토스트 -->
  <div class="toast-container" aria-live="polite"></div>

  <main class="page-body" id="mainContent">
    <!-- 검색 및 카테고리 탭 -->
    <div class="list-top-container">
      <div class="list-search-bar">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" placeholder="행사명, 장소로 검색" class="list-search-input">
      </div>
      <nav class="category-tabs" id="category-tabs" aria-label="행사 카테고리 필터"></nav>
    </div>

    <!-- 전체 벤토 그리드 섹션 -->
    <section class="bento-section list-bento-section">
      <div class="bento-grid" id="bento-grid" aria-label="행사 목록"></div>
    </section>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="하단 메뉴">
      <a href="index.html" class="bottom-nav-item" aria-label="홈">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        <span>홈</span>
      </a>
      <button class="bottom-nav-item" aria-label="검색">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <span>검색</span>
      </button>
      <a href="list.html" class="bottom-nav-item active" aria-label="티켓">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M20 12v6a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h6" />
          <path d="M14 4h6v6" />
          <path d="M10 14L20 4" />
        </svg>
        <span>티켓</span>
      </a>
      <button class="bottom-nav-item" aria-label="장바구니">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <path d="M16 10a4 4 0 01-8 0" />
        </svg>
        <span>장바구니</span>
      </button>
      <a href="mypage.html" class="bottom-nav-item" aria-label="마이페이지">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        <span>마이</span>
      </a>
    </nav>
  </main>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- JavaScript -->
  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/list.js"></script>
  <script src="js/recent_carousel.js"></script>
</body>

</html>
