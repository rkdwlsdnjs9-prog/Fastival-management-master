<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FESTIO | 모든 행사</title>

  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/list.css">
</head>

<body>
  <script src="js/components/sidePanel.js"></script>

  <!-- ══ 헤더 ═══════════════════════════════════════════════════ -->
  <script src="js/components/appHeader.js"></script>

  <!-- 모바일 검색 모달 -->
  <div class="modal-overlay modal-center" id="modal-mobile-search" role="dialog" aria-modal="true">
    <div class="modal-sheet">
      <div class="modal-header search-modal-header">
        <button class="modal-close-btn" data-close-modal="modal-mobile-search" aria-label="닫기">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="mobile-search-form">
          <div class="mobile-search-input-wrap">
            <svg class="icon search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="search" class="filter-range-input mobile-search-input" id="mobileSearchInput"
              placeholder="행사명, 아티스트 검색" autocomplete="off">
          </div>
          <button class="btn btn-pastel-blue" id="btn-mobile-search-execute">검색</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 토스트 -->
  <div class="toast-container" aria-live="polite"></div>

  <main class="page-body" id="mainContent">
    <!-- 검색 및 카테고리 탭 -->
    <div class="list-top-container">
      <div class="list-search-bar">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" placeholder="행사명, 장소로 검색" class="list-search-input">
      </div>
      <nav class="category-tabs" id="category-tabs" aria-label="행사 카테고리 필터"></nav>
    </div>

    <!-- 전체 벤토 그리드 섹션 -->
    <section class="bento-section list-bento-section">
      <div class="bento-grid" id="bento-grid" aria-label="행사 목록"></div>
    </section>

    <!-- Bottom Navigation -->
    <script src="js/components/bottomNav.js"></script>
  </main>

  <!-- Supabase JS -->
  <script src="js/components/appFooter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- JavaScript -->
  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/list.js"></script>
  <script src="js/recent_carousel.js"></script>
</body>

</html>
