spring.application.name=fastival-1

# Supabase PostgreSQL 연결 설정 (IPv4 지원 Connection Pooler 사용)
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.loqsekbplftdjphzewmx
spring.datasource.password=naver.com1!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA (Hibernate) 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Port Configuration
server.port=8082

# Multipart File Upload limits (Allow up to 100MB files for proposals/truck proposals)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 정적 리소스 캐시 비활성화 (개발용)
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# 덜 중요한 로그 숨기기 및 주요 로그만 표시
logging.level.root=WARN
logging.level.org.springframework.boot=INFO
logging.level.festival=INFO
logging.level.org.hibernate.SQL=WARN

# Thymeleaf를 사용하는 경우 캐시 비활성화
spring.thymeleaf.cache=false

# DevTools 정적 자원 실시간 반영 활성화
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true